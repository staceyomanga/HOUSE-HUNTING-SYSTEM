<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hostel Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav>
        <div style="color: white; font-weight: bold;">Hostel Finder</div>
        <div><a th:href="@{/search}">Back to Search</a></div>
    </nav>

    <div class="container">
        <div th:if="${param.sent}" style="color: green;">Your inquiry was sent.</div>
        <div th:if="${param.reviewed}" style="color: green;">Thanks for your review.</div>

        <h1 th:text="${hostel.name}">Hostel Name</h1>
        <p><strong>Status:</strong> <span th:text="${hostel.status}">APPROVED</span></p>
        <p><strong>Location:</strong> <span th:text="${hostel.location}">Location</span></p>
        <p><strong>Facilities:</strong> <span th:text="${hostel.facilities}">Facilities</span></p>
        <p><strong>Description:</strong> <span th:text="${hostel.description}">Description</span></p>

        <h3>Contact Landlord</h3>
        <a th:href="@{/inquiry/new/{id}(id=${hostel.hostelId})}" class="btn">Send Inquiry</a>
    </div>


</body>
</html>
