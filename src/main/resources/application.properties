# Database Connection (XAMPP Default)
spring.datasource.url=jdbc:mysql://localhost:3306/hostel_finder_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Settings (Auto-create tables from Java code)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf Settings (Allows HTML updates without restarting)
spring.thymeleaf.cache=false
