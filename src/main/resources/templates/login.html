<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HOUSE HUNTING SYSTEM</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="bg-login">
<div style="position: absolute; top: 20px; right: 20px;">
    <a href="#" onclick="toggleDarkMode()" style="color: #f1c40f; background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 5px; text-decoration: none;">🌙 Toggle Theme</a>
</div>
<div class="login-box">

    <img th:src="@{/images/logo.png}" alt="House Hunting Logo" class="login-logo">

    <h2>Login</h2>
    <form th:action="@{/login}" method="post">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <label class="show-pass">
            <input type="checkbox"  onclick="togglePassword()"> Show Password
        </label>
        <button type="submit">Login</button>
    </form>
    <p style="margin-top: 15px; text-align: center;">
        Don't have an account? <a th:href="@{/register}">Register here</a>
    </p>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
