<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>

       <title>My Profile</title>
       <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
           <nav>
               <div style="color: white; font-weight: bold;">Hostel Finder</div>
               <div><a th:href="@{/search}">Search</a> <a th:href="@{/logout}" style="color: #e74c3c;">Logout</a></div>
              </nav>
              <div class="container">
                  <h1>My Profile</h1>
                  <form th:action="@{/profile}" method="post">
                    <label>Preferred Campus:</label>
                    <select name="preferredCampus">

                  <option value="Main Campus">Main Campus</option>
                  <option value="Town Campus">Town Campus</option>
                </select>
                <label>Max Price:</label> 
                <input type="number" name="maxPrice" placeholder="e.g. 10000">
                <button type="submit">Save Profile</button> 
              </form>
             </div>

    </body>             
</html>
