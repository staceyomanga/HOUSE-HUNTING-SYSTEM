<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Hostel Finder</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="bg-login">
<div style="position: absolute; top: 20px; right: 20px;">
    <a href="#" onclick="toggleDarkMode()" style="color: #f1c40f; background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 5px; text-decoration: none;">🌙 Toggle Theme</a>
</div>
<div class="login-box">
    <img th:src="@{/images/logo.png}" alt="Hostel Finder Logo" class="login-logo">
    <h2>Create Account</h2>

    <form th:action="@{/register}" method="post">
        <label>Full Name:
            <input type="text" name="fullName" placeholder="Enter your full name" required>
        </label>

        <label>Phone Number:
            <input type="text" name="phone" placeholder="Enter your phone number" required>
        </label>

        <label>Email:
            <input type="email" name="email" placeholder="Enter your email" required>
        </label>

        <label>Select Your Role:
            <select name="role" required>
                <option value="" disabled selected>-- Choose Account Type --</option>
                <option value="STUDENT">Tenant (Student)</option>
                <option value="LANDLORD">Landlord</option>
            </select>
        </label>

        <label>Password:
            <input type="password" id="password" name="password" placeholder="Create a password" required>
        </label>

        <label class="show-pass">
            <input type="checkbox" onclick="togglePassword()"> Show Password
        </label>

        <button type="submit">Register</button>
    </form>

    <p style="margin-top: 15px; text-align: center;">
        Already have an account? <a th:href="@{/login}">Login here</a>
    </p>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
